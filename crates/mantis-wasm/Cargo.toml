[package]
name = "mantis-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

# Skip the wasm-opt pass: the wasm-pack-bundled wasm-opt fails to parse our
# SIMD-enabled wasm in CI ("Fatal: error in parsing input"). rustc already
# emits valid wasm with +simd128, so the module is correct without it.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
lopdf = "0.39"
# Bounded decoding of content streams for scans (same crates lopdf uses).
flate2 = "1"
weezl = "0.1"
wasm-bindgen = "0.2"
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
zune-jpeg = { version = "0.4", default-features = false }
jpeg-encoder = { version = "0.6", default-features = false }
# Unicode text: shaping, bidi and line breaking (pinned, see the unicode fonts spec).
ttf-parser = "=0.25.1"
rustybuzz = "=0.20.1"
unicode-bidi = "=0.3.18"
unicode-linebreak = "=0.1.5"

# The font crates ship (release, wasm) without overflow checks; test them the
# same way so the hostile-font tests exercise the shipped arithmetic (wrapping),
# not debug-only overflow panics inside their table parsers. Optimised so the
# shaping tests stay fast.
[profile.dev.package.rustybuzz]
overflow-checks = false
opt-level = 2

[profile.dev.package.ttf-parser]
overflow-checks = false
opt-level = 2
