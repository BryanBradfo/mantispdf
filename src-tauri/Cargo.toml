[package]
name = "app"
version = "2.0.1"
description = "MantisPDF desktop: privacy-first PDF toolkit."
authors = ["Bryan Chen"]
license = "MIT"
repository = "https://github.com/BryanBradfo/mantispdf"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
# License activation (ADR 03) talks to the Lemon Squeezy API over HTTP.
anyhow = "1"
ureq = "2"

# Automatic updates (desktop only): signed bundles from the GitHub release's latest.json, then a relaunch.
# 2.12.0 / 2.3.1 are the newest releases that still accept tauri 2.11 (later ones require tauri ^2.12).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "=2.3.1"
