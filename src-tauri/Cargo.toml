[package]
name = "app"
version = "1.0.6"
description = "MantisPDF desktop — privacy-first PDF toolkit."
authors = ["Bryan Chen"]
license = "MIT"
repository = "https://github.com/BryanBradfo/mantispdf"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
# License activation (ADR 03) talks to the Lemon Squeezy API over HTTP.
anyhow = "1"
ureq = "2"
