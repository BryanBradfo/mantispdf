name: Release

# Build and publish desktop installers for every OS when a version tag is pushed.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

# tauri-action creates a GitHub Release and uploads the installers, so the job
# needs write access to repository contents.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Two macOS targets so both Apple Silicon and Intel Macs get a build.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            rust_targets: "aarch64-apple-darwin,wasm32-unknown-unknown"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin,wasm32-unknown-unknown"
          # 22.04 (not 24.04) for a lower glibc baseline → the AppImage runs on
          # more distros.
          - platform: ubuntu-22.04
            args: ""
            rust_targets: "wasm32-unknown-unknown"
          - platform: windows-latest
            args: ""
            rust_targets: "wasm32-unknown-unknown"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # Tauri v2 Linux system dependencies (WebKitGTK, GTK, AppIndicator, rsvg).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file \
            libxdo-dev \
            libssl-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Cache the Rust build.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./crates/mantis-wasm -> target

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install JS dependencies
        run: npm ci

      # MUST run before tauri-action: the Tauri `beforeBuildCommand` is
      # `npm run build`, whose `vite build` imports the WASM package from the
      # gitignored crates/mantis-wasm/pkg/. Without this, the frontend build
      # fails to resolve `mantis-wasm`.
      - name: Build WASM engine
        run: npm run build:wasm

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Lemon Squeezy product scope (ADR 03). PUBLIC identifiers — set as
          # GitHub repo *Variables* (Settings → Secrets and variables → Actions
          # → Variables). Baked at build time:
          #  - LS_VARIANT_ID / LS_STORE_ID → option_env! in license.rs; scope Pro
          #    keys to THIS product (unset = scope check skipped = any key unlocks).
          #  - VITE_MANTIS_CHECKOUT_URL → the "Upgrade to Pro" CTA target; read by
          #    Vite during the beforeBuildCommand (npm run build).
          LS_VARIANT_ID: ${{ vars.LS_VARIANT_ID }}
          LS_STORE_ID: ${{ vars.LS_STORE_ID }}
          VITE_MANTIS_CHECKOUT_URL: ${{ vars.MANTIS_CHECKOUT_URL }}
          # --- Optional code-signing / notarization (see notes). If unset, the
          # build is unsigned and still produces installers. ---
          # macOS:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri updater signature (required: bundle.createUpdaterArtifacts is on, so every updater
          # bundle is signed with this key; the app checks it against plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MantisPDF ${{ github.ref_name }}"
          # A draft until every installer is uploaded; the publish job below then makes it public
          # (the site's download page links straight to these assets).
          releaseBody: |
            Download the installer for your platform below, or from https://mantispdf.bradfo.me/download. All processing runs locally.

            The installers are not signed yet:
            - macOS: on first launch, right-click MantisPDF in Applications, choose Open, then Open again.
            - Windows: if SmartScreen warns you, click More info, then Run anyway.
            - Linux: `chmod +x` the AppImage and run it (add `--appimage-extract-and-run` if FUSE is missing), or install the .deb or .rpm.
          releaseDraft: true
          # latest.json is NOT written here: parallel builds would race to merge it. The publish job
          # builds it once from every uploaded signature (scripts/release-latest-json.mjs).
          uploadUpdaterJson: false
          prerelease: false
          args: ${{ matrix.args }}

  # Publish the draft only once all four matrix builds have uploaded their installers. A failed build
  # leaves a draft (invisible to the download links) instead of a half-filled public release.
  # Before that, write the updater manifest (latest.json) from the signed assets on the release: the app
  # reads releases/latest/download/latest.json, which resolves only once the release is public.
  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the annotated tag's subject becomes the update notes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Build and upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # actions/checkout can turn the pushed tag into a lightweight one: fetch the real tag objects.
          git fetch --force --tags origin
          NOTES=""
          if [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ]; then
            NOTES="$(git for-each-ref "refs/tags/$TAG" --format='%(contents:subject)')"
          fi
          mkdir -p release-sigs
          gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' > release-assets.txt
          echo "Assets on the release:"; cat release-assets.txt
          gh release download "$TAG" --repo "$REPO" --pattern '*.sig' --dir release-sigs
          # Fails (and the release stays a draft) when a base platform is missing or unsigned.
          node scripts/release-latest-json.mjs --tag "$TAG" --repo "$REPO" \
            --assets release-assets.txt --sigs release-sigs --notes "$NOTES" --out latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$REPO"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$REPO"
