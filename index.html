<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/mantis_wo_text.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Self-hosted Inter (latin), also declared by @fontsource-variable/inter in main.tsx. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" />
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="xkhnRyi1X7Cpuq4DIPkfiDSTWxUL3tM5NSf2XY7-tMc" />
    <!-- Title, description, canonical, hreflang and the og:/twitter: page tags are rendered per page and
         language by PageSEO (react-helmet-async; React 19 hoists them into <head>). Static copies here would
         stay next to them as English duplicates, so only the tags PageSEO does not manage remain. -->
    <meta property="og:site_name" content="MantisPDF" />
    <meta property="og:image:type" content="image/png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "MantisPDF",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "description": "Free browser-based PDF tools. Split, merge, compress, rotate. Files never leave your device.",
      "url": "https://mantispdf.vercel.app"
    }
    </script>
    <script>
      (function () {
        var stored = localStorage.getItem("theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (stored === "dark" || (!stored && prefersDark)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
